<!DOCTYPE html>
<html>
    <head>
        <title>Expense - Tracker</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
        <h1 class="title">Expense Tracker</h1>
        <h2>ADD EXPENSE</h2>

        <form>
            <lable>Add description: </lable>
            <input type="text" id="description">

            <br><br>

            <lable>Amount: </lable>
            <input type="number" id="amount">

            <br><br>

            <label>Category:</label>
                <select id="Category">
                    <option>Food</option>
                    <option>Travel</option>
                    <option>Shopping</option>
                    <option>Entertainment</option>
                    <option>Recharge</option>
                </select>

                <br><br>

                <label>Date:</label>
                <input type="date" id="date">

                <br><br>

                <button type="submit" id="addexpense">+Add expense</button>

        </form>
        <input type="text" id="searchInput" placeholder="search expenses...">
        <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Recharge">Recharge</option>
            <option value="Entertainment">Entertainment</option>
        </select>
        <select id="sortFilter">
            <option value="latest">Latest First</option>
            <option value="oldest">Oldest First</option>
            <option value="high">Highest Amount</option>
            <option value="low">Lowest Amount</option>
        </select>
        <h2>Your Expense</h2>

        <ul id="expenseList">
        </ul>
        <h3 class="Total">Total :<span id="Total"> 0</span></h3>
        
        <div class="summary">

            <div class="card">
                <h3>Total Spent</h3>
                <p>₹<span id="totalSpent">0</span></p>
            </div>

            <div class="card">
                <h3>Budget Left</h3>
                <p>₹<span id="budgetLeft">25000</span></p>
            </div>

        </div>
    </div>
        <script src="script.js"></script>
    </body>
</html>
