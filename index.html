<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <h1>Expense Tracker</h1>
    <div class="month-pick">
        <label for="monthFilter">Month</label>
        <select id="monthFilter"></select>
    </div>
</header>

<main class="layout">
    <section class="panel" aria-labelledby="addTitle">
        <h2 id="addTitle">Add expense</h2>
        <form id="expenseForm" novalidate>
            <label for="description">Description</label>
            <input type="text" id="description" maxlength="80" autocomplete="off">

            <div class="row">
                <div>
                    <label for="amount">Amount (INR)</label>
                    <input type="number" id="amount" min="0.01" step="0.01" inputmode="decimal">
                </div>
                <div>
                    <label for="date">Date</label>
                    <input type="date" id="date">
                </div>
            </div>

            <label for="category">Category</label>
            <select id="category"></select>

            <p id="formError" class="error" role="alert"></p>
            <button type="submit" class="btn-main">Add expense</button>
        </form>
    </section>

    <section class="panel" aria-labelledby="sumTitle">
        <h2 id="sumTitle">This month</h2>
        <div class="figures">
            <div>
                <span class="fig-label">Spent</span>
                <span class="fig" id="totalSpent">0</span>
            </div>
            <div>
                <span class="fig-label">Left</span>
                <span class="fig" id="budgetLeft">0</span>
            </div>
        </div>
        <p id="budgetNote" class="note"></p>

        <label for="budget">Monthly budget (INR)</label>
        <input type="number" id="budget" min="1" step="1" inputmode="numeric">

        <h3>By category</h3>
        <div id="categoryBars"></div>
    </section>

    <section class="panel wide" aria-labelledby="listTitle">
        <div class="list-head">
            <h2 id="listTitle">Expenses <span id="listCount" class="count"></span></h2>
            <button type="button" id="exportCsv" class="btn-line">Export CSV</button>
        </div>

        <div class="filters">
            <div>
                <label for="searchInput">Search</label>
                <input type="search" id="searchInput" placeholder="Search by description">
            </div>
            <div>
                <label for="categoryFilter">Category</label>
                <select id="categoryFilter"></select>
            </div>
            <div>
                <label for="sortFilter">Sort</label>
                <select id="sortFilter">
                    <option value="latest">Latest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="high">Highest amount</option>
                    <option value="low">Lowest amount</option>
                </select>
            </div>
        </div>

        <ul id="expenseList"></ul>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
